services:
  - type: web
    name: agencia-empregos-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: agencia-empregos-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: agencia-empregos-db
    databaseName: agencia_empregos
    plan: free
